<!doctype html>
<!--
  Template for a document in the Explanations chapter (docs/INDEX.md) — a
  grounded answer to one question about the app as it is. Copy to
  docs/<kebab-title>.html and fill in; update the same file in place on
  re-render. Delete every comment, including this one.

  Self-contained by rule, and so is this template: inline <style>, no
  JavaScript, no webfonts, no CDN. The document must open from file:// with no
  network, forever. The template carries the whole skeleton rather than
  pointing at a shared one, because an author copies a template exactly once
  and then owns the result — a shared skeleton is an indirection paid on every
  read to save a duplication nobody maintains (2026-07-28, owner decision).

  Grounded by rule: every claim is observable in the repository at the pinned
  commit, or is a decision already recorded in a .md. A claim about what the
  app should become is not grounded — it belongs in the Proposals chapter.

  Six levels of question reach this chapter, and the level fixes the figure
  the document owes. Pick one. A document answering two questions is two
  documents, and the Question field is where that shows.

    level            the question            the figure it owes
    mechanism        how does X work?        the path one value takes through the parts
    decision         why is X this way?      the alternatives, the taken one marked, with
                                             the date and the .md that records it
    comparison       X or Y, on what axes?   the axes named before the verdict — often a
                                             table beats a drawing, and then use the table
    concept view     what are the parts?     the static graph: parts, edges, forbidden edges
    runtime view     what happens when?      a sequence, a state machine, or a lifecycle
    deployment view  where does it run?      process, device, permission, and storage
                                             boundaries, and what crosses each

  Nothing is decided here. If drawing reveals an unrecorded decision, it goes
  in a .md in the same change; if it reveals an undecided one, it goes in a
  proposal.

  The contract below is machine-read: script/check-docs.py hard-fails a commit
  whose document misses a required field, and the docs export flags a document
  that misses required structure.

  required-fields: Category, Question, Source, Updated, Commit
  required-elements: figure, figcaption
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- Title --> — camera</title>
<style>
  /* Charter ships with macOS, Georgia everywhere else, so the page needs no
     font download. Tufte's #fffff8 / #111 instead of pure black-on-white:
     nearly indistinguishable, without the harsh contrast. */
  html { font-size: 16px; }
  body {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 8rem;
    background: #fffff8;
    color: #111;
    font-family: Charter, "Bitstream Charter", Georgia, serif;
    line-height: 1.62;
    overflow-wrap: break-word;
  }

  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .9rem; font-weight: 600; }
  h2 { font-size: 1.3rem; margin: 3rem 0 .5rem; font-weight: 600; }
  h3 { font-size: 1.02rem; margin: 2rem 0 .3rem; font-weight: 600; }
  p, li { margin: .7rem 0; }
  ul, ol { padding-left: 1.2rem; }
  a { color: inherit; text-decoration-color: #aaa; }
  strong { font-weight: 600; }

  code, pre, .provenance dd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .85em;
  }
  /* Wide content scrolls inside itself; the page never scrolls sideways. */
  pre {
    overflow-x: auto;
    background: #f2f2ea;
    padding: 1rem;
    line-height: 1.45;
    margin: 1.4rem 0;
  }

  table { border-collapse: collapse; width: 100%; margin: 1.4rem 0; font-size: .9rem; }
  th, td { text-align: left; vertical-align: top; padding: .45rem .8rem .45rem 0; border-bottom: 1px solid #e2e2d8; }
  th { font-weight: 600; }
  /* phone-width table scroll: below the body's own max-width a multi-column
     table would crush to one word per line (width:100% leaves nothing to
     overflow, so nothing scrolls). The cell minimum keeps columns readable
     and pushes the table wide; display:block lets it pan inside its own box. */
  @media (max-width: 42rem) {
    table { display: block; overflow-x: auto; }
    th, td { min-width: 9rem; }
  }

  /* Header block — the same fields in every view document, plus the one
     field this chapter adds. */
  .provenance {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .15rem 1rem;
    margin: 0;
    font-size: .85rem;
    color: #555;
  }
  .provenance dt { font-variant: small-caps; letter-spacing: .04em; }
  .provenance dd { margin: 0; }

  figure { margin: 2.6rem 0; }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: .7rem; font-size: .85rem; color: #555; line-height: 1.5; }
</style>
</head>
<body>
<article>

  <header>
    <h1><!-- The answer as a sentence, not the topic as a noun --></h1>
    <dl class="provenance">
      <dt>Category</dt> <dd>explanation</dd>
      <dt>Question</dt> <dd><!-- the one question, and the level it sits at --></dd>
      <dt>Source</dt>   <dd>docs/&lt;file&gt;.md</dd><!-- or several; or "code: core/camera/…" -->
      <dt>Updated</dt>  <dd>YYYY-MM-DD</dd><!-- last render date -->
      <dt>Commit</dt>   <dd>&lt;short-sha&gt;</dd><!-- what pins the snapshot -->
    </dl>
  </header>

  <section>
    <!--
      The diagram is the conclusion: the figure the level owes leads, and the
      prose explaining it follows. That is why a figure and its caption are
      required structure here — an explanation with no figure is answering a
      question that was not 2D, and a table or a specification was the right
      shape for it.
    -->
    <!--
      Diagram conventions:
        - viewBox only; no width/height (the CSS scales it).
        - currentColor for strokes/text, so ink follows the body colour.
        - <title> for screen readers; role="img" on the <svg>.
        - Reach for SVG only where the relationship is genuinely 2D — a graph
          with cross-edges, a fan-in. A list drawn as boxes is worse than a list.
        - Suffix every id (arrow-<diagram>, not arrow). Inline SVG shares one
          id namespace with the whole page, so a second diagram reusing "arrow"
          silently points at the first diagram's marker.
    -->
    <figure>
      <svg viewBox="0 0 720 120" role="img" aria-labelledby="diagram-title">
        <title id="diagram-title"><!-- One sentence: what this diagram shows --></title>
        <defs>
          <marker id="arrow-example" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>
        <g fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="40" y="40" width="150" height="38"/>
          <rect x="530" y="40" width="150" height="38"/>
          <path d="M 190,59 L 525,59" marker-end="url(#arrow-example)"/>
        </g>
        <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
           font-size="13" text-anchor="middle" dominant-baseline="central">
          <text x="115" y="59">:depends</text>
          <text x="605" y="59">:on</text>
        </g>
      </svg>
      <figcaption><!-- What the reader should take from the figure. --></figcaption>
    </figure>

    <h2><!-- Section --></h2>
    <p><!-- Restate; do not decide. Say what is not shown, including sources
            that were dirty at render time. --></p>
  </section>

</article>
</body>
</html>
