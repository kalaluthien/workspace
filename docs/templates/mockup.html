<!doctype html>
<!--
  Template for a document in the Mockups chapter (docs/INDEX.md) — design
  exploration: a surface drawn before it exists. Copy to
  docs/<kebab-title>.html and fill in; update the same file in place on
  re-render. Delete every comment, including this one.

  Self-contained by rule, and so is this template: inline <style>, no
  JavaScript, no webfonts, no CDN. The document must open from file:// with no
  network, forever. The template carries the whole skeleton rather than
  pointing at a shared one, because an author copies a template exactly once
  and then owns the result — a shared skeleton is an indirection paid on every
  read to save a duplication nobody maintains (2026-07-28, owner decision).

  A mockup is a question, not a claim. It draws a surface that does not ship
  yet, or a variant of one that does, and it may be reproduced from the repo,
  drawn from scratch, or taken from a survey of other apps — the Source field
  says which. A drawing whose elements all ship is an explanation in the wrong
  chapter, because the shipped UI is grounded fact.

  Every element that does not ship today is marked in the drawing and named in
  the table with where it comes from, so a reader can never mistake the
  drawing for the repository. A mockup decides nothing: when a drawing is
  accepted, the decision is recorded in a .md and the caption points at it.

  The contract below is machine-read: script/check-docs.py hard-fails a commit
  whose document misses a required field, and the docs export flags a document
  that misses required structure.

  required-fields: Category, Source, Updated, Commit
  required-elements: figure, figcaption
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- Title --> — camera</title>
<style>
  /* Charter ships with macOS, Georgia everywhere else, so the page needs no
     font download. Tufte's #fffff8 / #111 instead of pure black-on-white:
     nearly indistinguishable, without the harsh contrast. */
  html { font-size: 16px; }
  body {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 8rem;
    background: #fffff8;
    color: #111;
    font-family: Charter, "Bitstream Charter", Georgia, serif;
    line-height: 1.62;
    overflow-wrap: break-word;
  }

  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .9rem; font-weight: 600; }
  h2 { font-size: 1.3rem; margin: 3rem 0 .5rem; font-weight: 600; }
  h3 { font-size: 1.02rem; margin: 2rem 0 .3rem; font-weight: 600; }
  p, li { margin: .7rem 0; }
  ul, ol { padding-left: 1.2rem; }
  a { color: inherit; text-decoration-color: #aaa; }
  strong { font-weight: 600; }

  code, pre, .provenance dd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .85em;
  }
  /* Wide content scrolls inside itself; the page never scrolls sideways. */
  pre {
    overflow-x: auto;
    background: #f2f2ea;
    padding: 1rem;
    line-height: 1.45;
    margin: 1.4rem 0;
  }

  table { border-collapse: collapse; width: 100%; margin: 1.4rem 0; font-size: .9rem; }
  th, td { text-align: left; vertical-align: top; padding: .45rem .8rem .45rem 0; border-bottom: 1px solid #e2e2d8; }
  th { font-weight: 600; }
  /* phone-width table scroll: below the body's own max-width a multi-column
     table would crush to one word per line (width:100% leaves nothing to
     overflow, so nothing scrolls). The cell minimum keeps columns readable
     and pushes the table wide; display:block lets it pan inside its own box. */
  @media (max-width: 42rem) {
    table { display: block; overflow-x: auto; }
    th, td { min-width: 9rem; }
  }

  /* Header block — the same fields in every view document, plus the one
     field this chapter adds. */
  .provenance {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .15rem 1rem;
    margin: 0;
    font-size: .85rem;
    color: #555;
  }
  .provenance dt { font-variant: small-caps; letter-spacing: .04em; }
  .provenance dd { margin: 0; }

  figure { margin: 2.6rem 0; }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: .7rem; font-size: .85rem; color: #555; line-height: 1.5; }
</style>
</head>
<body>
<article>

  <header>
    <h1><!-- Which surface, in which proposed state --></h1>
    <dl class="provenance">
      <dt>Category</dt> <dd>mockup</dd>
      <dt>Source</dt>   <dd><!-- docs/product-&lt;surface&gt;.md; a proposal; a survey; or "drawn from scratch" --></dd>
      <dt>Updated</dt>  <dd>YYYY-MM-DD</dd><!-- last render date -->
      <dt>Commit</dt>   <dd>&lt;short-sha&gt;</dd><!-- what pins the snapshot -->
    </dl>
  </header>

  <section>
    <h2><!-- The screen, or one region of it --></h2>

    <!--
      Diagram conventions:
        - viewBox only; no width/height (the CSS scales it).
        - currentColor for strokes/text, so ink follows the body colour.
        - <title> for screen readers; role="img" on the <svg>.
        - Reach for SVG only where the relationship is genuinely 2D — a graph
          with cross-edges, a fan-in. A list drawn as boxes is worse than a list.
        - Suffix every id (arrow-<diagram>, not arrow). Inline SVG shares one
          id namespace with the whole page, so a second diagram reusing "arrow"
          silently points at the first diagram's marker.
    -->
    <figure>
      <svg viewBox="0 0 360 720" role="img" aria-labelledby="screen-title">
        <title id="screen-title"><!-- One sentence: which screen, in which state --></title>
        <!-- Number each element in the drawing and name it in the table below,
             so the caption never has to describe a position in prose. Draw a
             speculative element in a dashed stroke, so the split reads before
             the table is. -->
      </svg>
      <figcaption>
        <!-- Required: which elements are speculative, and what the drawing
             leaves out. "Every element speculative" is a valid caption; so is
             "the chrome is as shipped, the panel is proposed". -->
      </figcaption>
    </figure>

    <table>
      <thead><tr><th>#</th><th>What the owner would see</th><th>Ships today</th><th>Comes from</th></tr></thead>
      <tbody><tr><td>1</td><td></td><td><!-- yes | no --></td><td><!-- a proposal, a survey, or the spec it already has --></td></tr></tbody>
    </table>
  </section>

</article>
</body>
</html>
